name: tests
on: [push, pull_request]
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s forgerl -p 'test_alignment.py' -v
      - run: python -m compileall -q forgerl
